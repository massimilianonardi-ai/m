name: m core checkout smoke

on:
  push:
    branches:
      - master
      - m-core-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check standalone bootstrap and core commands without host Node
        shell: sh
        run: |
          set -eu
          root=$(pwd -P)
          [ -x ./m ]
          [ ! -e bin/sys/mk ]
          [ ! -e lib/sys/js/mk.lib.js ]

          shadow="${RUNNER_TEMP:-/tmp}/m-no-node"
          mkdir -p "$shadow"
          printf '#!/bin/sh\nexit 97\n' > "$shadow/node"
          chmod 755 "$shadow/node"
          PATH="$shadow:$PATH"
          export PATH

          ./m sh -c '[ -n "$m_ROOT" ] && [ -n "$m_LIB_DIR" ] && [ -n "$m_PKG_DIR" ]'
          ./m osarch update
          ./m osarch show
          ./m state-path system sys pkg conf
          [ "$(./m lang-set)" = en_US ]
          ./m manual --no-pager pkg > /dev/null
          ./m manual --no-pager core.lib.sh > /dev/null
          ./m manual --no-pager pkg-versions.lib.sh > /dev/null
          ./m pkg versions nodejs >/dev/null 2>&1 && {
            printf '%s\n' 'Unexpected installed package in clean checkout' >&2
            exit 1
          } || :
          ./m tls-ca list > /dev/null

          # A fresh browser HOME with no approved CAs requires no NSS tools,
          # database creation or inherited platform environment.
          unset m_OSARCH m_OSARCH_OS m_OSARCH_ARCH
          nss_home=$(mktemp -d "${RUNNER_TEMP:-/tmp}/m-empty-nss.XXXXXXXX")
          trap 'rm -rf -- "$nss_home"' 0
          if [ "$(uname -s)" = Linux ]
          then
            ./m tls-nss-sync "$nss_home"
            [ ! -e "$nss_home/.m" ]
            [ ! -e "$nss_home/.pki" ]
            [ ! -e "$nss_home/.local" ]
          else
            if ./m tls-nss-sync "$nss_home" > /dev/null 2>&1
            then
              printf '%s\n' 'NSS unexpectedly supported on a non-Linux host' >&2
              exit 1
            else
              [ "$?" -eq 4 ]
            fi
          fi
          rm -rf -- "$nss_home"
          trap - 0

          # No catalog or Node.js is required for bootstrap and local checks.
          [ ! -d "$root/pkg" ] || [ -z "$(ls -A "$root/pkg")" ]
          find lib/sys/sh -type f -name '*.lib.sh' -exec sh -n {} \;
          for cmd in bin/sys/*
          do
            [ -f "$cmd" ] || continue
            [ -x "$cmd" ] || continue
            [ -f "res/sys/manual/${cmd##*/}" ]
          done
          find lib/sys/sh -type f -name '*.lib.sh' -print |
          while IFS= read -r library
          do
            [ -f "res/sys/manual/${library##*/}" ] || exit 1
          done

          # The inherited browser repository adapters are real m libraries.
          # Exercise loading and offline semantics on both supported hosts;
          # live package transport and NSS browser startup are separate gates.
          ./m manual --no-pager pkg-repository-chrome.lib.sh > /dev/null
          ./m manual --no-pager pkg-repository-chromium.lib.sh > /dev/null
          browser_adapters=$(mktemp -d "${RUNNER_TEMP:-/tmp}/m-browser-adapters.XXXXXXXX")
          trap 'rm -rf -- "$browser_adapters"' 0
          mkdir -p "$browser_adapters/chrome" "$browser_adapters/chromium"
          printf 'chrome\n' > "$browser_adapters/chrome/type"
          printf 'chromium\n' > "$browser_adapters/chromium/type"
          printf 'Linux_x64\n' > "$browser_adapters/chromium/platform"
          ./m sh -c '
            . "$m_LIB_DIR/sys/sh/core.lib.sh" || exit 1
            loadsyslib "pkg/repository/pkg-repository-chrome" || exit 1
            [ "$(pkg_repository_compare_versions "$1" 153.0.8010.36-1 153.0.8010.36-2)" = -1 ]
          ' sh "$browser_adapters/chrome"
          ./m sh -c '
            . "$m_LIB_DIR/sys/sh/core.lib.sh" || exit 1
            loadsyslib "pkg/repository/pkg-repository-chromium" || exit 1
            command -v pkg_repository_resolve_artifact > /dev/null || exit 1
            if pkg_repository_resolve_version "$1" invalid >/dev/null 2>&1; then
              exit 1
            fi
          ' sh "$browser_adapters/chromium"
          rm -rf -- "$browser_adapters"
          trap - 0
